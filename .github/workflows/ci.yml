name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest   # image default Xcode
            xcode: default
          - runner: macos-15
            xcode: "16.0"
          - runner: macos-15
            xcode: "16.4"
          - runner: macos-15
            xcode: "26.0"
          - runner: macos-14
            xcode: "15"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        if: matrix.xcode != 'default'
        run: |
          app=$(ls -d /Applications/Xcode_${{ matrix.xcode }}*.app | sort -V | tail -1)
          sudo xcode-select -s "$app"
      - run: xcodebuild -version
      - name: tests/run.sh
        run: tests/run.sh
